name: 生成数字自然女声音频

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/generate-number-audio.py
      - .github/workflows/generate-number-audio.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python 与音频工具
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "edge-tts>=7,<8"

      - name: 生成 1～100 中文自然女声音频
        run: python scripts/generate-number-audio.py

      - name: 提交生成结果
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/numbers
          if git diff --cached --quiet; then
            echo "音频没有变化"
          else
            git commit -m "build: 替换 1～100 为自然神经女声音频"
            git push origin HEAD:main
          fi
